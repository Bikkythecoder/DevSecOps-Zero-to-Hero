name: Terraform Deployment

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform

    steps:
      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install jq
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # 3. Debug GitHub OIDC claims
      - name: Debug GitHub OIDC Claims
        shell: bash
        run: |
          set -euo pipefail

          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://github.com/Bikkythecoder" \
            | jq -r '.value')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f 2)
          PAYLOAD=$(echo "$PAYLOAD" | tr '_-' '/+')

          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac

          echo "$PAYLOAD" | base64 -d | jq '{sub, aud, repository, ref}'

          unset TOKEN PAYLOAD

      # 4. Authenticate with Vault
      - name: Fetch AWS Credentials from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          path: jwt
          role: gh-actions-role
          jwtGithubAudience: https://github.com/Bikkythecoder
          secrets: |
            aws/creds/terraform-role access_key | AWS_ACCESS_KEY_ID ;
            aws/creds/terraform-role secret_key | AWS_SECRET_ACCESS_KEY

      # 5. Verify AWS authentication
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # 6. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 7. Initialize Terraform
      - name: Terraform Init
        run: terraform init

      # 8. Validate Terraform
      - name: Terraform Validate
        run: terraform validate

      # 9. Generate Terraform plan
      - name: Terraform Plan
        run: terraform plan

      # 10. Apply infrastructure
      - name: Terraform Apply
        run: terraform apply -auto-approve
